name: Build

on:
  release:
    types: [published]
  push:
    branches: [eoleun]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyinstaller

    - name: Build
      run: |
        pyinstaller --noconsole --onefile installer.py

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: i-installer.exe
        path: dist/installer.exe
